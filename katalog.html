<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Kendaraan - Sahabat Rental Mobil</title>
  <meta name="description" content="Katalog armada Sahabat Rental Mobil: cek ketersediaan mobil berdasarkan tanggal sewa, filter transmisi, dan cari nama mobil.">
  <meta name="theme-color" content="#272B2E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23CFDC66'/%3E%3Cpath d='M6 19L9 12C9.5 10.8 10.6 10 12 10H20C21.4 10 22.5 10.8 23 12L26 19' stroke='%23272B2E' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Crect x='5' y='17.5' width='22' height='7' rx='3.5' fill='%23272B2E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-root"></div>

  <main>
    <div class="page-head">
      <div class="container">
        <span class="label label-light">Katalog</span>
        <h1>Katalog Kendaraan</h1>
        <p>Pilih tanggal sewa dan filter sesuai kebutuhan untuk melihat mobil yang tersedia.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <form class="box filter-box no-print" onsubmit="event.preventDefault(); tampilKatalog();" novalidate>
          <div class="alert alert-err" id="kt-err" role="alert" aria-live="assertive"></div>
          <div class="filter-grid">
            <div>
              <label for="kt-mulai">Tanggal Mulai</label>
              <input type="date" id="kt-mulai" onchange="tampilKatalog()">
            </div>
            <div>
              <label for="kt-selesai">Tanggal Selesai</label>
              <input type="date" id="kt-selesai" onchange="tampilKatalog()">
            </div>
            <div>
              <label for="kt-transmisi">Transmisi</label>
              <select id="kt-transmisi" onchange="tampilKatalog()">
                <option value="">Semua</option>
                <option>Manual</option>
                <option>Matic</option>
              </select>
            </div>
            <div>
              <label for="kt-cari">Cari Nama / Tipe Mobil</label>
              <input type="search" id="kt-cari" placeholder="Contoh: Avanza" oninput="tampilKatalog()" autocomplete="off">
            </div>
            <div>
              <button type="submit" class="btn btn-dark btn-block">Cek Ketersediaan</button>
            </div>
          </div>
        </form>
        <p class="result-info" id="kt-info" aria-live="polite"></p>
        <div class="grid-3" id="kt-list"></div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="js/script.js"></script>
</body>
</html>
